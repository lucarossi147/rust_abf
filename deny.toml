# cargo-deny configuration, checked in CI by the `deny` job:
#   cargo deny check licenses bans advisories
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check the optional `parallel` feature (rayon) too.
all-features = true

[advisories]
# Fail on any RustSec vulnerability; flag unmaintained crates only when we
# depend on them directly (transitive dev-dependencies are out of our hands).
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with this crate's MIT license. This covers
# the runtime graph (rayon and its crossbeam deps, behind `parallel`) and the
# dev-dependency graph (criterion, serde, tempfile, …).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.93

[bans]
# Dev-dependencies currently pull two `syn` majors (criterion -> zerocopy uses
# syn 2, serde uses syn 3); report duplicates without failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
