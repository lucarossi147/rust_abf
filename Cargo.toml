[package]
name = "rust_abf"
version = "0.6.0"
edition = "2021"
rust-version = "1.66"
license = "MIT"
authors = ["Luca Rossi <lucarossi147@gmail.com>"]
description = "Rust crate for reading data from Axon Binary Format (ABF) files."
repository = "https://github.com/lucarossi147/rust_abf"
homepage = "https://github.com/lucarossi147/rust_abf"
documentation = "https://docs.rs/rust_abf"
readme = "README.md"
keywords = ["abf", "electrophysiology", "axon", "patch-clamp", "neuroscience"]
categories = ["science", "parser-implementations", "encoding"]
exclude = ["tests/test_abf/*", "tests/golden/*", "scripts/*", ".github/*", "benches/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
memmap2 = "0.9.11"
# Optional: multi-threaded decoding of large sweeps (see the `parallel` feature).
# 1.10 is the last rayon line whose MSRV (1.63) fits this crate's rust-version.
rayon = { version = "1.10", optional = true }

[features]
default = []
# Decode large sweeps on rayon's global thread pool in the allocating read
# APIs (`Channel::sweep`, `Channel::raw_sweep`, `Abf::sweep_all_channels`).
# The `*_into` APIs stay single-threaded and allocation-free either way.
parallel = ["dep:rayon"]

[dev-dependencies]
criterion = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "read"
harness = false
