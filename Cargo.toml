[package]
name = "rust_abf"
version = "0.4.4"
edition = "2021"
license = "MIT"
authors = ["Luca Rossi <lucarossi147@gmail.com>"]
description = "Rust crate for reading data from Axon Binary Format (ABF) files."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
memmap2 = "0.9.5"
byteorder = "1.5.0"
rayon = "1.10.0"

[dev-dependencies]
criterion = "0.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13.0"

[[bench]]
name = "read"
harness = false
